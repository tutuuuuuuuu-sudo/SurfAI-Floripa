name: Snapshot — Histórico de Condições

# Horário automático no agendador do Supabase desde 30/set/2026 (pg_cron: jobs robo-*,
# função public.call_robot) — o agendamento do GitHub atrasava até 6 h. Aqui fica só a
# execução manual.
on:
  workflow_dispatch:

permissions: {}

jobs:
  run-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de snapshot
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L \
            "${{ secrets.APP_URL }}/api/snapshot?secret=${{ secrets.SNAPSHOT_SECRET }}")
          echo "Status HTTP: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Snapshot retornou status $STATUS"
            exit 1
          fi
