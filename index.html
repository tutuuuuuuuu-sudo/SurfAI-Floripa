    <script>
      // Endereço oficial de cada página pro Google. O mesmo index.html serve todas as rotas, então
      // um canonical fixo em /landing fazia Privacidade/Termos se declararem cópia da landing.
      // A raiz manda quem não está logado pra /landing, por isso aponta pra lá.
      (function () {
        var link = document.createElement('link')
        link.rel = 'canonical'
        link.href = 'https://www.surfaifloripa.com.br' + (location.pathname.replace(/\/+$/, '') || '/landing')
        document.head.appendChild(link)
      })()
    </script>
